[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "continuity"
version = "0.1.0"
description = "AI conversation continuity — remember everything, forget nothing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Continuity Contributors" }
]
keywords = ["ai", "memory", "conversation", "context", "llm", "openai", "anthropic", "google"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
cli = [
    "click>=8.0",
    "rich>=13.0",
]
embeddings = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
continuity = "continuity.cli.main:cli"

[project.entry-points."mcp_servers"]
continuity = "continuity.mcp.server:mcp"

[tool.hatch.build.targets.wheel]
packages = ["continuity"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
